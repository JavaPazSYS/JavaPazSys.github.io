  <!-- Antes del primer dibujo: si aún no hay decisión sobre la medición de visitas (y el
       navegador no pide no ser rastreado), se muestra el aviso. Ver ConsentimientoService. -->
  <script>
    (function () {
      try {
        var decidido = localStorage.getItem('consentimiento-analitica');
        var noRastrear = navigator.globalPrivacyControl === true || navigator.doNotTrack === '1';
        if (!decidido && !noRastrear) document.documentElement.classList.add('medicion-pendiente');
      } catch (e) { }
      // Entrada de la portada: el loto aparece primero y después el nombre. Se esconde antes de
      // pintar para que no parpadee; la portada la anima y quita la clase. Se ve siempre que se
      // abre la portada (decisión de diseño: también con «reducir movimiento» activado).
      try {
        var html = document.documentElement;
        if (location.pathname === '/') {
          html.classList.add('entrada-pendiente');
          setTimeout(function () { html.classList.remove("entrada-pendiente"); }, 8000);
        }
      } catch (e) { }
    })();
  </script>
